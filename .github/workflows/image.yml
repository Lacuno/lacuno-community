name: Image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lacuno/lacuno-community:main
            ghcr.io/lacuno/lacuno-community:${{ github.sha }}
      # Cloud pins the runtime image by this digest.
      - run: echo "ghcr.io/lacuno/lacuno-community@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
